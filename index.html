<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MU7009 Home</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#17223e}body{overflow:hidden}
.scene{position:fixed;inset:0;background:linear-gradient(180deg,#253e70 0%,#7c6397 43%,#f3a477 68%,#192c50 100%)}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 45%,#ffd2a0 0 5%,#ffb889 6%,transparent 23%)}
.mountain{position:absolute;inset:0;background:#172b4a;clip-path:polygon(0 72%,13% 56%,25% 70%,42% 43%,56% 69%,73% 48%,86% 68%,100% 51%,100% 100%,0 100%)}
.mountain.back{background:#5b5279;opacity:.85;clip-path:polygon(0 68%,16% 51%,33% 66%,49% 49%,63% 65%,80% 42%,100% 62%,100% 100%,0 100%)}
.shade{position:fixed;inset:0;background:linear-gradient(90deg,rgba(7,16,37,.72),rgba(7,16,37,.22)),linear-gradient(0deg,rgba(7,16,37,.5),transparent 60%)}
main{position:relative;z-index:1;padding:5vh 6vw}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:700}.clock{font-size:24px;font-weight:600}h1{font-size:clamp(34px,5vw,70px);margin:13vh 0 8px}.subtitle{font-size:22px;margin:0 0 6vh}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.app{border:3px solid transparent;border-radius:19px;min-height:140px;color:#fff;font-weight:bold;font-size:clamp(18px,2.4vw,34px);cursor:pointer;box-shadow:0 12px 32px #07122566;background:#25355cdd}.app:focus{outline:4px solid white;outline-offset:3px;transform:scale(1.03)}.youtube{background:#f4f4f4;color:#252525}.youtube b{color:#f22}.netflix{background:#171717;color:#e50914}.prime{background:#0574b9}.disney{background:#172a72}.notice{font-size:15px;margin-top:32px;min-height:24px;color:#f3f4fa}.foot{position:fixed;bottom:18px;left:6vw;font-size:12px;color:#ddd}
@media(max-width:650px){.apps{grid-template-columns:repeat(2,1fr)}.app{min-height:100px}h1{margin-top:7vh}.subtitle{margin-bottom:3vh}}
</style></head><body><div class="scene"><div class="mountain back"></div><div class="mountain"></div></div><div class="shade"></div><main><div class="top"><div class="brand">◆ MU7009 Home</div><div class="clock" id="clock">--:--</div></div><h1>Hallo!</h1><p class="subtitle">Deine Lieblings-Apps auf einen Blick</p><div class="apps"><button class="app youtube" data-app="YouTube"><b>▶</b> YouTube</button><button class="app netflix" data-app="Netflix">NETFLIX</button><button class="app prime" data-app="Prime Video">prime video</button><button class="app disney" data-app="Disney+">Disney+</button></div><p class="notice" id="notice" aria-live="polite">Mit den Pfeiltasten navigieren und OK drücken.</p></main><div class="foot">Design-Prototyp · Samsung-App-Start noch nicht integriert</div><script>
(function(){var buttons=[].slice.call(document.querySelectorAll('.app'));var notice=document.getElementById('notice');function tick(){var d=new Date();document.getElementById('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}tick();setInterval(tick,15000);buttons.forEach(function(b,i){b.addEventListener('click',function(){notice.textContent=b.getAttribute('data-app')+': Samsung-App-Start muss noch eingerichtet werden.'});b.addEventListener('keydown',function(e){var n=i;if(e.key==='ArrowRight')n=(i+1)%4;if(e.key==='ArrowLeft')n=(i+3)%4;if(e.key==='ArrowDown')n=(i+2)%4;if(e.key==='ArrowUp')n=(i+2)%4;if(n!==i){e.preventDefault();buttons[n].focus()}})});buttons[0].focus()})();
</script></body></html>
